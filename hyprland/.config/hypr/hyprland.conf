# Source from other files
source = ~/.config/hypr/themes/mocha.conf

# Monitors, matched by make/model/serial so they keep their place whichever GPU port they're plugged into
$mon_left = desc:ASUSTek COMPUTER INC VG279Q3A S1LMTF140392
$mon_main = desc:CORSAIR MEMORY Inc. 45WQHD240 A2RIC31480J1
$mon_vert = desc:ASUSTek COMPUTER INC VG279Q3A S1LMTF140395

general {
  gaps_in = 5
    gaps_out = 10
    border_size =2
    col.active_border = $active-border
    col.inactive_border = $inactive-border
    layout = dwindle
}

# Ultrawide: split side-by-side once, then stack top/bottom inside each half.
# A tile splits side-by-side only if width > height * multiplier; halves there are ~1701x1356,
# so 1.5 flips them to top/bottom. Keep it < 1.9 or the left monitor's first split stacks too.
dwindle {
  split_width_multiplier = 1.5
}

# NVIDIA & Wayland Support
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Hardware Acceleration & Fixes
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Aquamarine Fixes
# env = AQ_NO_ATOMIC,1
# env = AQ_NO_MODIFIERS,1

# idk
env = WLR_NO_HARDWARE_CURSOR,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

cursor {
  no_hardware_cursors = true
    enable_hyprcursor = true
    # Don't let cursor movement break VRR in fullscreen games (auto mode needs content-type=game, which Proton may not set)
    no_break_fs_vrr = 1
}

# Keyboard layout
input {
  kb_layout = us,th
    kb_options = grp:win_space_toggle
}

# Cursor
input {
# Sensitivity: -1.0 to 1.0
  sensitivity = 0.1
  # Accel profiles: flat, adaptive
    accel_profile = flat
}

# Decoration

decoration {
  rounding = 10

    blur {
      enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }
}
# Steam games
windowrule {
  name = steam_games
  match:class = ^(steam_app.*)$
  # EVE (8500) runs several windows at once; its rules live in eve.conf
  match:initial_class = negative:^steam_app_8500$
  monitor = $mon_main
  float = on
  fullscreen = on
  border_size = 0
}

# Steam client → left monitor
windowrule {
  name = steam_client
  match:class = ^(steam)$
  monitor = $mon_left
}

# EVE Online
source = ~/projects/eve-eyes/hypr/eve.conf

# Kitty windowrule
windowrule {
  name = kitty_style
    match:class = ^(kitty)$
    opacity = 0.9 0.8
}

# Claude Code (from Neovim) → vertical monitor
windowrule {
  name = claude_code
  match:class = ^(kitty)$
  match:title = ^(ClaudeCode)$
  workspace = 6
}

# Awakened PoE Trade window rules
windowrule {
  name = APT
  match:class = awakened-poe-trade
  float = on
  no_blur = true
  no_shadow = true
  border_size = 0
}

# Rofi Layer Rules
layerrule {
  name = rofi_layer
    match:namespace = ^(rofi)$
    blur = on
    ignore_alpha = on
}

# Dunst Layer Rules
layerrule {
  name = dunst_blur
    match:namespace = ^(notifications)$
    blur = on
    ignore_alpha = on
}

## Workspaces Binding
# Left
workspace = 1, monitor:$mon_left, default:true, persistent:true
workspace = 2, monitor:$mon_left, persistent:true
workspace = 8, monitor:$mon_left, persistent:true

# Center 
workspace = 3, monitor:$mon_main, default:true, persistent:true
workspace = 4, monitor:$mon_main, persistent:true
workspace = 5, monitor:$mon_main, persistent:true

# Right
workspace = 6, monitor:$mon_vert, default:true, persistent:true
workspace = 7, monitor:$mon_vert, persistent:true

# Monitor Configuration
# monitor = name, resolution, position, scale, transform

monitor = $mon_left, 1920x1080@144, 0x0, 1
monitor = $mon_main, 3440x1440@240, 1920x0, 1, vrr, 2
monitor = $mon_vert, 1920x1080@144, 5360x0, 1, transform, 3

# Basic Keybinds
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, R, exec, rofi -show drun -show-icons
bind = $mainMod, M, exit,
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, S, exec, hyprcap shot region -z -c -n
bind = $mainMod SHIFT, D, exec, ~/.local/bin/shot-to-box
bind = $mainMod, L, exec, hyprlock
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, togglefloating

# Workpsaces Keybinds
bind = $mainMod, s, togglespecialworkspace,
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, mouse_up, focusworkspaceoncurrentmonitor, m+1
bind = $mainMod, mouse_down, focusworkspaceoncurrentmonitor, m-1

# Jump focus to another monitor while some app grab input
bindpx = $mainMod, left, focusmonitor, $mon_left
bindpx = $mainMod, down, focusmonitor, $mon_main
bindpx = $mainMod, right, focusmonitor, $mon_vert

exec-once = waybar -c ~/.config/waybar/config
exec-once = waybar -c ~/.config/waybar/config_vertical.jsonc
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
# Make the ultrawide the X11 primary so Proton games pick its resolution, not the vertical monitor's
exec-once = xrandr --output "$(hyprctl monitors -j | jq -r '.[] | select("desc:" + .description == "$mon_main") | .name')" --primary
