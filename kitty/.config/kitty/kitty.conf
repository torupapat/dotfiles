include theme.conf

# Fonts
font_family		JetBrainsMono Nerd Font
bold_font		auto
italic_font		auto
bold_italic_font	auto
font_size		12.0

# Window Layout
window_padding_width	15
confirm_os_window_close	0
# Don't restore the last window's size/state: a closed maximized window would make
# every new kitty start maximized over the tiled windows (Hyprland tiles anyway)
remember_window_size	no

# Transparency
background_opacity	0.8
background_blur		1

# Perfomance
repaint_delay		2
input_delay		0
sync_to_monitor	no

# Cursor
cursor_shape		beam
cursor_vi_mode_bold	yes

# Scrollback
scrollback_lines	2000

# Clipboard: mouse selection also goes to the system clipboard (Ctrl+V elsewhere),
# not just the primary selection (middle-click)
copy_on_select		clipboard

# Map Ctrl + - to send a custom sequence
map ctrl+minus send_text all \x1f

# Map Alt + - to send what Zsh expects
map alt+minus send_text all \e-

# Map shift+enter to new line in tmux
map shift+enter send_text all \x1b[13;2u
